  <aside class="sidebar">
    <div class="logo">
      <img class="logo-image" src="Logo.png" alt="" width="64" height="64" />
      <div class="logo-text"><span>Consulta <strong>BR</strong></span><small>Central de consultas</small></div>
    </div>

    <div class="sidebar-scroll">
    <nav class="nav nav-tipos" aria-label="Tipo de busca">
      <span class="nav-label">EXPLORAR</span>
      <ul>
        <li *ngFor="let t of ['Nome','Nome parcial','CPF','CNPJ','Telefone','Endereço','Placa']" [class.ativo]="tipo === t && !historyMode">
          <button type="button" [attr.aria-pressed]="tipo === t && !historyMode" (click)="selected.emit(t)">
            <app-icon [name]="icon(t)" [size]="19" />
            <span>{{ t === 'Nome' ? 'Nome completo' : t }}</span>
            <app-icon class="nav-arrow" name="arrow" [size]="15" *ngIf="tipo === t && !historyMode" />
          </button>
        </li>
      </ul>
    </nav>

    <nav class="nav nav-secoes" *ngIf="dados && !historyMode" aria-label="Seções do resultado">
      <span class="nav-label">NESTA CONSULTA</span>
      <ul>
        <ng-container *ngFor="let s of secoes">
        <li *ngIf="temDados(s.key)" class="tem-dados">
          <a [attr.href]="temDados(s.key) ? '#secao-' + s.key : null"
            [attr.aria-disabled]="!temDados(s.key)" [attr.tabindex]="temDados(s.key) ? 0 : -1">
            {{ s.label }}
            <span class="count" *ngIf="temDados(s.key)">{{ dados[s.key].length }}</span>
          </a>
        </li>
        </ng-container>
      </ul>
    </nav>

    </div>
    <div class="sidebar-footer">
      <span class="source-icon"><app-icon name="database" [size]="19" /></span>
      <div><span class="source-caption">FONTE DE DADOS</span><strong>SQL Server · BR</strong></div>
    </div>
  </aside>
