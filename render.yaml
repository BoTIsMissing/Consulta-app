services:
  - type: web
    name: consulta-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEARCH_HISTORY_ENABLED
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json
      - key: SQL_CREDENTIALS_FILE
        value: /etc/secrets/sql-credentials.json
      - key: ALLOWED_ORIGINS
        sync: false
