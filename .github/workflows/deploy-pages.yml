name: Publicar Angular no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Instalar dependências
        run: npm ci
      - name: Compilar Angular
        run: npm run build -- --base-href /Consulta-app/
      - name: Enviar somente o frontend compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/consulta-app-new/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
